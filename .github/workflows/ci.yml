name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      DISABLE_RATE_LIMIT: "true"
      ADMIN_SETUP_CODE: test-setup-code-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Start app
        run: npx next start -p 3100 &
      - run: for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/book/donald && break; sleep 1; done
      - run: npm test
        env:
          E2E_BASE_URL: http://localhost:3100
